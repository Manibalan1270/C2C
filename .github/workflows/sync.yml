name: Sync coding platforms

# The XP/streak/leaderboard engine. Runs here rather than in a Cloud
# Function because Cloud Functions require the Blaze billing plan and this
# project is on Spark — the Admin SDK bypasses Firestore rules either way,
# so the security property is identical.
on:
  schedule:
    # Every 15 minutes. Was 6 hours, which was too slow for the thing members
    # actually want to know: "did the site notice I solved it?" Waiting hours
    # for that answer makes the feature feel broken even when it works.
    #
    # 15 is a floor set by GitHub, not by us. Scheduled workflows on shared
    # runners are best-effort and routinely drift 5-15 minutes under load, so
    # anything tighter buys nothing real — a "*/5" cron does not produce runs
    # five minutes apart. Expect 15-30 minutes in practice.
    #
    # The politeness budget still holds. Each member costs 2 LeetCode requests
    # spaced by politeDelay, so a 50-member club is ~100 requests per run and
    # ~7 per minute averaged out. If LeetCode ever starts returning errors in
    # bulk, widen this interval first — it is the cheapest lever, and the
    # engine is idempotent so a skipped run costs nothing but freshness.
    #
    # FIRESTORE QUOTA CEILING — this interval is not free above a club size.
    # Measured against the 50,000 reads/day Spark limit, with idle members
    # skipping the recompute (see `nothingChanged` in syncPlatforms.ts):
    #
    #     50 members  -> ~43% of quota      safe
    #    100 members  -> ~81% of quota      safe, watch it
    #    200 members  -> ~158% of quota     EXCEEDS - reads start failing
    #
    # Past ~100 members, widen this to "*/30" (halves it) or move to Blaze.
    # The failure mode is ugly: reads fail for everyone, so the app looks
    # broken rather than merely stale. Check the Firestore usage graph before
    # a big recruitment push.
    - cron: "*/15 * * * *"
  # Lets a board member trigger a run by hand from the Actions tab, e.g.
  # right after posting a new weekly challenge.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read and report without writing"
        type: boolean
        default: false

# Two runs writing at once is safe (every award is idempotent) but wasteful
# and makes the logs confusing, so serialise instead.
concurrency:
  group: platform-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Run sync
        env:
          # Repo secret: paste the full service-account JSON as one line.
          # Settings > Secrets and variables > Actions > New repository secret
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run sync -- --dry-run
          else
            npm run sync
          fi
